[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-test-sequencer"
version = "0.3.2"
description = "Step-file sequencer for EA PSI/EL and Clayton/Altairnano BMS capacity tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6.0",
  "PyYAML>=6.0.1",
  "python-can>=4.3.0",
  "pyserial>=3.5",
]

[project.scripts]
bts = "bts.app:main"

[tool.setuptools.packages.find]
where = ["src"]
